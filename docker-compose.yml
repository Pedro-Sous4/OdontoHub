      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecret
      BYPASS_AUTH: 'false'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-""}
    volumes:
      - ./backend:/app:cached
      - backend_node_modules:/app/node_modules
    depends_on:
      - postgres
      - redis
      - ollama

  stock-service:
