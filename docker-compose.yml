services:
  api:
    build: ./backend
    environment:
      SERVICE_CMD: dev:gateway
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/odontohub
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecret
      BYPASS_AUTH: 'false'

      USE_CONTAINER_HOSTS: 'true'
    ports:
      - '3000:3000'
    volumes:
      - ./backend:/app:cached
      - backend_node_modules:/app/node_modules
    depends_on:
      - postgres
      - redis
      - minio
      - auth-service

  auth-service:
    build: ./backend
    environment:
      SERVICE_CMD: dev:auth
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/odontohub
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecret
      BYPASS_AUTH: 'false'

    volumes:
      - ./backend:/app:cached
      - backend_node_modules:/app/node_modules
    depends_on:
      - postgres
      - redis

  patients-service:

    build: ./backend
    environment:
      SERVICE_CMD: dev:patients
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/odontohub
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecret
      BYPASS_AUTH: 'false'

      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: odonto-files
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
    volumes:
      - ./backend:/app:cached
      - backend_node_modules:/app/node_modules
    depends_on:
      - postgres
      - redis
      - minio

  assistant-service:
